<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Droppr</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true"></div>
    <div class="shell">
      <header class="header">
        <div class="brand"><img src="icons/droppr.png" alt="" /><div><span>DROPPR</span><strong id="greeting">Your price watch</strong></div></div>
        <button id="refresh" class="icon-button" type="button" title="Check prices now" aria-label="Check prices now"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.2 6"/><path d="M20 4v7h-7"/></svg></button>
      </header>
      <main id="view" aria-live="polite"></main>
      <nav class="dock" aria-label="Main navigation">
        <button data-view="home" class="active"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/></svg>Home</button>
        <button data-view="lists"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>Lists</button>
        <button data-view="deals"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5v6a8 8 0 0 0 8 8h8"/><path d="m15 14 5 5-5 5"/></svg>Deals</button>
        <button data-view="settings"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Settings</button>
      </nav>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
